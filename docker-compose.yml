version: '3.9'

services:
  my-db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: 'maternal_control'
      MYSQL_USER: 'admin'
      MYSQL_PASSWORD: 'password'
      MYSQL_ROOT_PASSWORD: 'password'
    ports:
      - '3307:3307'
    expose:
      - '3307'
    volumes:
      - my-db:/var/lib/mysql

  app:
    build: .
    volumes:
      - .:/app
    ports:
      - "8080:8080"
    depends_on:
      - database
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/mydb || {SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: myuser || {SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: mypassword || {SPRING_DATASOURCE_PASSWORD}

volumes:
  database_data: